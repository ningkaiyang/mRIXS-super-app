<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/katex.min.css">
<!-- QWebChannel JS bridge (built-in Qt resource) -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/katex.min.js"></script>
<style>
* {
  box-sizing: border-box;
}
body {
  background: #1a1a2e;
  color: #e8eaf6;
  font-family: "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  margin: 0;
  padding: 10px;
  font-size: 13px;
  line-height: 1.5;
}
#chat-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 24px;
}

/* ── Message bubbles ─────────────────────────────────── */
.message {
  padding: 10px 14px;
  border-radius: 8px;
  max-width: 92%;
  word-wrap: break-word;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.user {
  align-self: flex-end;
  background: #2196f3;
  color: #ffffff;
  border-bottom-right-radius: 2px;
  font-weight: 450;
}
.agent {
  align-self: flex-start;
  background: #16213e;
  border: 1px solid #2d3561;
  width: 100%;
  border-bottom-left-radius: 2px;
  color: #e2e8f0;
}

/* ── Markdown Content Styling ────────────────────────── */
.agent h1, .agent h2, .agent h3, .agent h4, .agent h5, .agent h6 {
  margin: 12px 0 6px 0;
  font-weight: 600;
  line-height: 1.35;
}
.agent h1:first-child, .agent h2:first-child, .agent h3:first-child, .agent h4:first-child {
  margin-top: 0;
}
.agent h1 {
  font-size: 15px;
  color: #60a5fa;
  border-bottom: 1px solid #2d3561;
  padding-bottom: 4px;
}
.agent h2 {
  font-size: 14px;
  color: #93c5fd;
}
.agent h3 {
  font-size: 13px;
  color: #a5b4fc;
}
.agent h4 {
  font-size: 12.5px;
  color: #c7d2fe;
}
.agent p {
  margin: 6px 0;
  line-height: 1.5;
}
.agent p:first-child {
  margin-top: 0;
}
.agent p:last-child {
  margin-bottom: 0;
}
.agent ul, .agent ol {
  margin: 6px 0;
  padding-left: 20px;
}
.agent li {
  margin: 3px 0;
  line-height: 1.45;
}
.agent strong {
  font-weight: 600;
  color: #ffffff;
}
.agent em {
  color: #cbd5e1;
}
.agent blockquote {
  margin: 8px 0;
  padding: 6px 12px;
  border-left: 3px solid #3b82f6;
  background: rgba(59, 130, 246, 0.08);
  border-radius: 0 4px 4px 0;
  color: #cbd5e1;
}
.agent blockquote p {
  margin: 0;
}
.agent table {
  border-collapse: collapse;
  width: 100%;
  margin: 8px 0;
  font-size: 12px;
}
.agent th, .agent td {
  border: 1px solid #2d3561;
  padding: 5px 8px;
  text-align: left;
}
.agent th {
  background: #0f172a;
  color: #93c5fd;
  font-weight: 600;
}
.agent tr:nth-child(even) td {
  background: rgba(255, 255, 255, 0.02);
}
.agent hr {
  border: none;
  border-top: 1px solid #2d3561;
  margin: 10px 0;
}
.agent a {
  color: #60a5fa;
  text-decoration: underline;
}

/* ── KaTeX Math Elements ─────────────────────────────── */
.katex-display {
  margin: 8px 0 !important;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 0;
}
.katex {
  font-size: 1.05em;
}

/* ── Approval cards ─────────────────────────────────── */
.approval-card {
  border: 1.5px solid #d97706;
  background: #1e1b2e;
  border-radius: 8px;
  padding: 12px 14px;
  animation: fadeIn 0.15s ease-out;
}
.approval-card .title-row {
  color: #f59e0b;
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.approval-card pre.args-pre {
  background: #0d1117;
  border: 1px solid #2d3561;
  padding: 8px 10px;
  border-radius: 5px;
  overflow-x: auto;
  margin: 6px 0;
  color: #c5cad3;
  font-size: 12px;
  font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
}
.approval-card .btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.approval-card button {
  padding: 6px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  transition: background 0.15s, opacity 0.15s, transform 0.05s;
}
.approval-card button:active {
  transform: scale(0.98);
}
.btn-approve {
  background: #d97706;
  color: white;
}
.btn-approve:hover {
  background: #f59e0b;
}
.btn-reject {
  background: #aa3333;
  color: white;
}
.btn-reject:hover {
  background: #cc4444;
}

/* Rejection inline box */
.reject-box {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.reject-input {
  background: #0d1117;
  border: 1px solid #aa3333;
  border-radius: 4px;
  color: #fff;
  padding: 6px 8px;
  font-size: 12px;
  outline: none;
  font-family: inherit;
}
.reject-input:focus {
  border-color: #ef5350;
}
.reject-actions {
  display: flex;
  gap: 8px;
}
.btn-confirm-reject {
  background: #aa3333;
  color: white;
}
.btn-confirm-reject:hover {
  background: #cc4444;
}
.btn-cancel-reject {
  background: #2d3561;
  color: #cbd5e1;
}
.btn-cancel-reject:hover {
  background: #3b467d;
}

/* Rejected permanent badge */
.rejection-badge-card {
  border: 1px solid #aa3333;
  background: rgba(170, 51, 51, 0.15);
  border-radius: 6px;
  padding: 8px 12px;
  color: #ef5350;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Tool cards ─────────────────────────────────────── */
details.tool-card {
  background: #141b33;
  border: 1px solid #243056;
  border-radius: 6px;
  overflow: hidden;
  animation: fadeIn 0.15s ease-out;
  transition: border-color 0.2s;
}
details.tool-card[open] {
  border-color: #3b4b80;
}
details.tool-card summary {
  cursor: pointer;
  background: #182242;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  font-size: 12px;
  list-style: none;
}
details.tool-card summary::-webkit-details-marker {
  display: none;
}
.summary-left {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 600;
  color: #cbd5e1;
}
.summary-left::before {
  content: '▶';
  font-size: 9px;
  color: #8b9bb4;
  transition: transform 0.15s ease;
}
details.tool-card[open] .summary-left::before {
  transform: rotate(90deg);
}
.tool-icon {
  font-size: 13px;
}
.tool-badge {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 500;
}
.status-running {
  background: rgba(33, 150, 243, 0.2);
  color: #64b5f6;
  border: 1px solid rgba(33, 150, 243, 0.4);
  animation: pulse-badge 1.5s infinite ease-in-out;
}
.status-done {
  background: rgba(46, 125, 50, 0.2);
  color: #81c784;
  border: 1px solid rgba(46, 125, 50, 0.4);
}
.status-error {
  background: rgba(211, 47, 47, 0.2);
  color: #ef5350;
  border: 1px solid rgba(211, 47, 47, 0.4);
}
@keyframes pulse-badge {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.tool-body {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #10162a;
}
.tool-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tool-section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #8b9bb4;
}
pre.tool-pre {
  background: #090d16;
  border: 1px solid #1a2238;
  padding: 7px 9px;
  border-radius: 4px;
  overflow-x: auto;
  margin: 0;
  color: #c9d1d9;
  font-size: 11.5px;
  font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-all;
}
pre.tool-output-pre {
  max-height: 220px;
  overflow-y: auto;
}

/* ── Error cards ────────────────────────────────────── */
.error-card {
  border: 1px solid #aa3333;
  background: rgba(170, 51, 51, 0.15);
  color: #ef5350;
  border-radius: 6px;
  padding: 9px 12px;
  font-size: 12px;
}

/* ── Code formatting ────────────────────────────────── */
code {
  background: rgba(255,255,255,0.08);
  padding: 1.5px 5px;
  border-radius: 3px;
  font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
  font-size: 12px;
}
pre {
  background: #0d1117;
  padding: 8px 10px;
  border: 1px solid #243056;
  border-radius: 4px;
  overflow-x: auto;
  margin: 6px 0;
}
pre code {
  background: none;
  padding: 0;
}

/* ── Scrollbar ──────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2d3561; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #4e5d99; }

/* ── Welcome card & quick prompt chips ───────────────── */
.welcome-card {
  margin: 4px 2px 12px 2px;
  padding: 14px 12px;
  background: #16213e;
  border: 1px solid #2d3561;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: fadeIn 0.2s ease-out;
}
.welcome-badge {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: #38bdf8;
  letter-spacing: 0.5px;
}
.welcome-title {
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
}
.welcome-subtitle {
  font-size: 12px;
  color: #9fa8da;
  line-height: 1.4;
}
.quick-chips-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 4px;
}
.quick-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: #1a1a2e;
  border: 1px solid #2d3561;
  border-radius: 7px;
  color: #e2e8f0;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.quick-chip:hover {
  background: #242f56;
  border-color: #3b82f6;
  transform: translateY(-1px);
}
.quick-chip:active {
  transform: scale(0.99);
}
.chip-icon {
  font-size: 16px;
  flex-shrink: 0;
}
.chip-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.chip-title {
  font-size: 12.5px;
  font-weight: 600;
  color: #ffffff;
}
.chip-desc {
  font-size: 11px;
  color: #8b9bb4;
}
.tool-timer {
  font-size: 11px;
  opacity: 0.9;
}
</style>
<script>
/* ── QWebChannel bridge initialisation ────────────────── */
var bridge = null;
if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
    });
}

let msgCounter = 0;
let _activeToolCallId = null;
const toolStartTimes = {};

function sendQuickPrompt(text) {
    if (bridge && typeof bridge.quick_prompt === 'function') {
        bridge.quick_prompt(text);
    }
}
window.sendQuickPrompt = sendQuickPrompt;

function hideWelcomeCard() {
    const wc = document.getElementById('welcome-card');
    if (wc) wc.style.display = 'none';
}

function showWelcomeCard() {
    const wc = document.getElementById('welcome-card');
    if (wc) wc.style.display = 'flex';
}

function scrollToBottom() {
    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
    });
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

/* ── Markdown & KaTeX Math Parser ────────────────────── */
function parseMarkdown(text) {
    if (!text) return '';

    // If marked or katex are not yet available, fallback to basic escaping
    if (typeof marked === 'undefined') {
        return escapeHtml(text).replace(/\n/g, '<br>');
    }

    // 1. Protect code blocks and inline code from math/regex collisions
    const codeTokens = [];
    let cleanText = text.replace(/(```[\s\S]*?```|`[^`\n]+`)/g, function(match) {
        const id = "%%CODE_TOKEN_" + codeTokens.length + "%%";
        codeTokens.push(match);
        return id;
    });

    // 2. Extract and render LaTeX math formulas
    const mathTokens = [];

    // Block math: $$...$$ or \[...\]
    cleanText = cleanText.replace(/(\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\])/g, function(match, p1, p2, p3) {
        const formula = p2 !== undefined ? p2 : p3;
        if (typeof katex !== 'undefined') {
            try {
                const html = katex.renderToString(formula.trim(), { displayMode: true, throwOnError: false });
                const id = "%%KATEX_TOKEN_" + mathTokens.length + "%%";
                mathTokens.push(html);
                return "\n\n" + id + "\n\n";
            } catch (e) {
                return match;
            }
        }
        return match;
    });

    // Inline math: $...$ or \(...\)
    cleanText = cleanText.replace(/(\$([^\$\n]+?)\$|\\\(([\s\S]*?)\\\))/g, function(match, p1, p2, p3) {
        const formula = p2 !== undefined ? p2 : p3;
        if (typeof katex !== 'undefined') {
            try {
                const html = katex.renderToString(formula.trim(), { displayMode: false, throwOnError: false });
                const id = "%%KATEX_TOKEN_" + mathTokens.length + "%%";
                mathTokens.push(html);
                return id;
            } catch (e) {
                return match;
            }
        }
        return match;
    });

    // 3. Restore code tokens
    for (let i = 0; i < codeTokens.length; i++) {
        cleanText = cleanText.replace("%%CODE_TOKEN_" + i + "%%", codeTokens[i]);
    }

    // 4. Parse Markdown with marked.js
    if (typeof marked.setOptions === 'function') {
        marked.setOptions({
            breaks: true,
            gfm: true
        });
    }
    let html = marked.parse(cleanText);

    // 5. Restore rendered KaTeX math tokens
    for (let i = 0; i < mathTokens.length; i++) {
        html = html.split("%%KATEX_TOKEN_" + i + "%%").join(mathTokens[i]);
    }

    return html;
}

/* ── Message API ─────────────────────────────────────── */
function appendUserMessage(text) {
    hideWelcomeCard();
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = 'message user';
    div.innerText = text;
    container.appendChild(div);
    scrollToBottom();
}

function startAssistantMessage(msgId) {
    hideWelcomeCard();
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = 'message agent';
    div.id = msgId;
    container.appendChild(div);
    scrollToBottom();
}

function appendToken(msgId, token) {
    const div = document.getElementById(msgId);
    if (div) {
        div.dataset.rawText = (div.dataset.rawText || '') + token;
        div.innerHTML = parseMarkdown(div.dataset.rawText);
        scrollToBottom();
    }
}

function finalizeMessage(msgId) {
    const div = document.getElementById(msgId);
    if (div && !div.innerHTML.trim()) {
        // If empty bubble was created with 0 tokens, cleanly remove it
        div.remove();
    }
}

/* ── Approval API ────────────────────────────────────── */
function addApprovalCard(callbackId, toolName, argsJson) {
    hideWelcomeCard();
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = 'approval-card';
    div.id = 'approval-' + callbackId;
    
    div.innerHTML =
        '<div class="title-row">⚠️ Approval Required: ' + escapeHtml(toolName) + '</div>' +
        '<pre class="args-pre">' + escapeHtml(argsJson) + '</pre>' +
        '<div class="btn-row" id="btn-row-' + callbackId + '">' +
            '<button class="btn-approve" onclick="doApprove(\'' + callbackId + '\')">✓ Approve</button>' +
            '<button class="btn-reject" onclick="toggleReject(\'' + callbackId + '\')">✕ Reject</button>' +
        '</div>' +
        '<div class="reject-box" id="reject-box-' + callbackId + '" style="display:none;">' +
            '<input type="text" class="reject-input" id="reject-input-' + callbackId + '" placeholder="Reason for rejection (optional)...">' +
            '<div class="reject-actions">' +
                '<button class="btn-confirm-reject" onclick="doConfirmReject(\'' + callbackId + '\', \'' + escapeHtml(toolName) + '\')">Confirm Reject</button>' +
                '<button class="btn-cancel-reject" onclick="toggleReject(\'' + callbackId + '\')">Cancel</button>' +
            '</div>' +
        '</div>';

    container.appendChild(div);
    scrollToBottom();
}

function doApprove(callbackId) {
    if (bridge) {
        bridge.approve(callbackId);
    }
    const card = document.getElementById('approval-' + callbackId);
    if (card) {
        card.remove(); // Remove completely upon approval
    }
}

function toggleReject(callbackId) {
    const btnRow = document.getElementById('btn-row-' + callbackId);
    const rejectBox = document.getElementById('reject-box-' + callbackId);
    if (btnRow && rejectBox) {
        const isHidden = rejectBox.style.display === 'none';
        rejectBox.style.display = isHidden ? 'flex' : 'none';
        btnRow.style.display = isHidden ? 'none' : 'flex';
        if (isHidden) {
            const input = document.getElementById('reject-input-' + callbackId);
            if (input) input.focus();
        }
    }
}

function doConfirmReject(callbackId, toolName) {
    const input = document.getElementById('reject-input-' + callbackId);
    const reason = input ? input.value.trim() : '';
    if (bridge) {
        bridge.reject(callbackId, reason);
    }
    const card = document.getElementById('approval-' + callbackId);
    if (card) {
        card.className = 'rejection-badge-card';
        card.innerHTML = '❌ <b>Rejected (' + escapeHtml(toolName) + ')</b>' + (reason ? ': ' + escapeHtml(reason) : ': User declined execution');
    }
}

/* ── Tool Card API ───────────────────────────────────── */
function addToolCard(callId, toolName, argsJson, status) {
    hideWelcomeCard();
    const container = document.getElementById('chat-container');
    const details = document.createElement('details');
    details.className = 'tool-card';
    details.id = 'tool-card-' + callId;
    details.open = true; // Open by default while running

    _activeToolCallId = callId;
    toolStartTimes[callId] = performance.now();

    details.innerHTML =
        '<summary>' +
            '<div class="summary-left">' +
                '<span class="tool-icon">⚙️</span>' +
                '<span class="tool-name">' + escapeHtml(toolName) + '</span>' +
            '</div>' +
            '<span class="tool-badge status-running" id="tool-badge-' + callId + '">⏳ running...</span>' +
        '</summary>' +
        '<div class="tool-body">' +
            '<div class="tool-section">' +
                '<div class="tool-section-label">Parameters</div>' +
                '<pre class="tool-pre tool-input-pre">' + escapeHtml(argsJson) + '</pre>' +
            '</div>' +
            '<div class="tool-section">' +
                '<div class="tool-section-label">Output</div>' +
                '<pre class="tool-pre tool-output-pre" id="tool-output-' + callId + '"></pre>' +
            '</div>' +
        '</div>';

    container.appendChild(details);
    scrollToBottom();
}

function addCLILine(line) {
    if (_activeToolCallId) {
        const outPre = document.getElementById('tool-output-' + _activeToolCallId);
        if (outPre) {
            outPre.textContent += line + '\n';
            outPre.scrollTop = outPre.scrollHeight;
            scrollToBottom();
            return;
        }
    }
}

function updateToolCard(callId, toolName, output, status) {
    const card = document.getElementById('tool-card-' + callId);
    if (card) {
        const badge = document.getElementById('tool-badge-' + callId);
        const startTime = toolStartTimes[callId];
        let elapsedStr = '';
        if (startTime) {
            const elapsedMs = performance.now() - startTime;
            elapsedStr = elapsedMs >= 1000 ? (elapsedMs / 1000).toFixed(1) + 's' : Math.round(elapsedMs) + 'ms';
            delete toolStartTimes[callId];
        }
        const timerSpan = elapsedStr ? ' • <span class="tool-timer">⏱ ' + elapsedStr + '</span>' : '';
        if (badge) {
            if (status === 'error' || (typeof output === 'string' && output.startsWith('Error:'))) {
                badge.className = 'tool-badge status-error';
                badge.innerHTML = '✕ failed' + timerSpan;
            } else {
                badge.className = 'tool-badge status-done';
                badge.innerHTML = '✓ completed' + timerSpan;
            }
        }

        const outPre = document.getElementById('tool-output-' + callId);
        if (outPre) {
            outPre.textContent = output || 'Completed with no output.';
        }

        // Auto-collapse into a compact summary bar upon completion
        card.removeAttribute('open');
    }

    if (_activeToolCallId === callId) {
        _activeToolCallId = null;
    }
    scrollToBottom();
}

function addErrorCard(errorMsg) {
    hideWelcomeCard();
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = 'error-card';
    div.innerText = '❌ ' + errorMsg;
    container.appendChild(div);
    scrollToBottom();
}

function clearAll() {
    document.getElementById('chat-container').innerHTML = '';
    _activeToolCallId = null;
    showWelcomeCard();
}
</script>
</head>
<body>
    <div id="welcome-card" class="welcome-card">
        <div class="welcome-badge">🤖 Beamline AI Assistant</div>
        <div class="welcome-title">RIXS Co-Pilot</div>
        <div class="welcome-subtitle">Directly query datasets, trigger sub-pixel alignment, and calibrate mirror pitch focus.</div>
        
        <div class="quick-chips-grid">
            <button class="quick-chip" onclick="window.sendQuickPrompt('Help me align the loaded TIFF sequence using ECC engine')">
                <span class="chip-icon">⚡</span>
                <div class="chip-text">
                    <span class="chip-title">Align TIFF Stack</span>
                    <span class="chip-desc">Sub-pixel spatial drift registration (ECC)</span>
                </div>
            </button>
            <button class="quick-chip" onclick="window.sendQuickPrompt('Find optimal mirror pitch zeroth-order focus position across scan frames')">
                <span class="chip-icon">🎯</span>
                <div class="chip-text">
                    <span class="chip-title">Calibrate Best Focus</span>
                    <span class="chip-desc">FWHM Gaussian profile analysis</span>
                </div>
            </button>
            <button class="quick-chip" onclick="window.sendQuickPrompt('Inspect loaded dataset files, frame counts, and scan log metadata')">
                <span class="chip-icon">📊</span>
                <div class="chip-text">
                    <span class="chip-title">Inspect Dataset</span>
                    <span class="chip-desc">Check frame count and scan log alignment</span>
                </div>
            </button>
            <button class="quick-chip" onclick="window.sendQuickPrompt('Explain differences between PCA, ECC, and Phase Correlation alignment engines')">
                <span class="chip-icon">ℹ️</span>
                <div class="chip-text">
                    <span class="chip-title">Engine Guide</span>
                    <span class="chip-desc">Compare PCA, ECC, and Phase Correlation</span>
                </div>
            </button>
        </div>
    </div>
    <div id="chat-container"></div>
</body>
</html>
